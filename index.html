<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Market Event Calendar</title><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#ffae43">
<style>
:root{--ink:#34394b;--muted:#81869a;--pink:#f6d5e4;--purple:#ebe2ff;--green:#d7f1df;--line:#e9e5ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf7fc;color:var(--ink)}
.app{max-width:720px;margin:auto;padding:22px 14px 104px}
h1{font-size:24px;margin:8px 4px 5px;letter-spacing:-.6px} .sub{font-size:12px;color:var(--muted);margin:0 4px 23px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.toolbar strong{font-size:17px;text-align:center}
.arrow,.today{border:1px solid var(--line);border-radius:13px;background:white;padding:9px 13px;color:#665d7c;font-size:16px;cursor:pointer}
.today{font-size:12px;background:var(--purple)}.arrows{display:flex;gap:7px}
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.day{min-height:170px;background:white;border:1px solid #eee8f0;border-radius:19px;padding:12px;box-shadow:0 4px 14px #76678a0a;cursor:pointer;overflow:hidden}
.day.today-card{border:2px solid #c6addd;background:#fffbff}.day .head{display:flex;gap:8px;align-items:baseline;margin-bottom:12px}.day .num{font-size:22px;font-weight:750}.day .weekday{font-size:12px;color:var(--muted)}.day .event{padding:7px 8px;border-radius:9px;background:#f4effb;border-left:3px solid #ad9ad7;font-size:12px;margin:6px 0;overflow-wrap:anywhere}.day .event time{display:block;color:#70688e;font-size:10px;padding-bottom:3px}.empty{font-size:11px;color:#c4bfd0;margin-top:20px}.plus{float:right;color:#ac93c8;font-size:20px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding-bottom:8px}.cell{border:1px solid var(--line);background:white;border-radius:10px;min-height:77px;padding:6px 4px;text-align:left;cursor:pointer;overflow:hidden;color:var(--ink)}.cell.other{opacity:.36}.cell.today-cell{border:2px solid #b798d5}.cell strong{font-size:12px}.cell .mark{font-size:10px;background:#eee4fa;border-radius:4px;padding:2px 3px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell .more{font-size:10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:15px;background:#fffdfef5;border-top:1px solid #eee5f0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:4}.nav button{width:min(43vw,220px);padding:12px;border:0;border-radius:14px;background:#f5f1f7;color:#766f82;font-weight:700;font-size:14px;cursor:pointer}.nav button.active{background:#e9def5;color:#614b88}
.scrim{position:fixed;inset:0;background:#251b3280;display:none;z-index:7;align-items:flex-end;justify-content:center}.scrim.show{display:flex}.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:white;border-radius:23px 23px 0 0;padding:22px 19px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px;font-size:21px}.field{display:flex;flex-direction:column;margin:11px 0;gap:6px;font-size:12px;color:#686178}.field input,.field textarea{font:inherit;font-size:16px;border:1px solid #e0dbe7;border-radius:11px;padding:12px;color:var(--ink);background:#fff;width:100%}.field textarea{min-height:75px;resize:vertical}.actions{display:flex;gap:9px;margin-top:19px}.actions button,.add,.row button{border:0;border-radius:12px;padding:12px 16px;background:#eee9f4;color:#655a78;cursor:pointer}.actions .save,.add{background:#dfccef;color:#44335d;font-weight:750;flex:1}.actions .danger{background:#fbe2e2;color:#af4f59}.list{margin:14px 0}.row{border:1px solid #ece6f1;border-radius:13px;padding:11px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:6px}.row small{color:var(--muted)}.row b{display:block}.row button{font-size:14px;padding:9px 11px}.row button:disabled{opacity:.3;cursor:default}.event-text{white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-width:0;font-size:15px}.row-controls{display:flex;gap:5px;flex-shrink:0}.day .event,.cell .mark{white-space:pre-wrap}.add{width:100%;margin-top:9px}footer{color:#a6a0b2;text-align:center;font-size:11px;margin-top:35px}@media(min-width:600px){.day{min-height:150px}.app{padding-top:32px}}

/* Larger, more legible dates and event text on phone and desktop */
h1{font-size:29px}.sub{font-size:14px}
.toolbar strong{font-size:20px}.today{font-size:15px}
.day .num{font-size:29px}.day .weekday{font-size:16px}
.day .event{font-size:17px;line-height:1.35;padding:9px 10px}
.day .event time{font-size:13px}.empty{font-size:14px}
.dow{font-size:13px}.cell strong{font-size:16px}
.cell .mark{font-size:12px;line-height:1.35}.cell .more{font-size:12px}
.nav button{font-size:17px}.sheet h2{font-size:24px}
.field{font-size:16px}.field textarea{font-size:18px;line-height:1.4}
.event-text{font-size:18px;line-height:1.4}
.actions button,.add,.row button{font-size:16px}
@media(max-width:390px){.month-grid{gap:3px}.cell{padding:5px 2px}.cell strong{font-size:15px}.cell .mark{font-size:11px}}

/* Per-week and per-month calendar colors */
.toolbar .settings-btn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px;font-size:20px;cursor:pointer}
.toolbar{flex-wrap:wrap}.toolbar strong{flex:1;min-width:125px}
.color-sheet{align-items:center}.color-sheet .sheet{border-radius:22px;max-height:85vh;padding-bottom:30px}
.color-sub{font-size:15px;color:#78718a;line-height:1.45;margin:0 0 16px}
.color-scope{display:flex;gap:9px;margin-bottom:14px}.color-scope button{flex:1;padding:12px;border-radius:12px;border:1px solid #ded6e8;background:white;font-size:16px;color:#655a78}
.color-scope button.active{background:#e9def5;border-color:#bba6d5;font-weight:700}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;margin:18px 0}
.swatch{aspect-ratio:1;border-radius:14px;border:2px solid #ffffff;box-shadow:0 0 0 1px #d9d3e0;cursor:pointer;position:relative}
.swatch.chosen{box-shadow:0 0 0 3px #67517f}.swatch.chosen:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#2e2940;font-size:22px;font-weight:bold}
.custom-color{display:flex;align-items:center;gap:12px;font-size:16px;margin:18px 0}.custom-color input{width:62px;height:44px;border:0;background:none}
.color-actions{display:flex;gap:9px}.color-actions button{flex:1;padding:12px;border:0;border-radius:12px;font-size:16px;background:#eee9f4;color:#514368}
@media(max-width:400px){.palette{gap:8px}.toolbar{gap:7px}.toolbar strong{font-size:17px;min-width:110px}.settings-btn{padding:8px}}

/* Borderless calendar with an event sidebar */
body{background:#fffcfd;color:#17213b}
.app{max-width:1480px;padding:28px 25px 105px}
h1{font-size:30px;margin-bottom:7px}.sub{margin-bottom:22px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,370px);gap:24px;align-items:start}
#content{min-width:0}
.month-grid{gap:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:15px;font-weight:650;padding:17px 0 15px;color:#525b74}
.dow:first-child{color:#df356f}.dow:nth-child(7){color:#2389d6}
.cell{border:0!important;border-radius:0;background:transparent!important;box-shadow:none;min-height:116px;padding:14px 7px 7px;overflow:visible;position:relative;text-align:left;transition:background .15s}
.cell:hover,.cell.selected-cell{background:#f9f2fa!important;border-radius:12px}
.cell.today-cell strong{background:#f7d3e5;border-radius:9px;padding:2px 6px;margin-left:-6px}
.cell.other{opacity:.35}
.cell strong{font-size:20px;font-weight:650;display:inline-block}
.cell:nth-child(7n + 1) strong{color:#e33371}
.cell:nth-child(7n) strong{color:#228cda}
.cell .mark{font-size:13px;line-height:1.35;padding:6px 6px;margin-top:6px;border-radius:7px;white-space:normal;overflow-wrap:anywhere;overflow:hidden;text-overflow:ellipsis;background:#f4d8e8;color:#30344b}
.cell .mark:nth-of-type(4n + 2){background:#e9dcf9}.cell .mark:nth-of-type(4n + 3){background:#d8eafa}.cell .more{font-size:12px}
.days{gap:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.day{border:0!important;box-shadow:none!important;background:transparent!important;border-radius:12px;min-height:160px;padding:18px}
.day:hover,.day.selected-day{background:#f9f2fa!important}
.day .num{font-size:28px}.day .event{border:0;border-radius:7px;background:#f5deea;font-size:16px}
.day .event:nth-of-type(3n){background:#e7dcf9}
.day .event:nth-of-type(3n + 1){background:#d8eaf9}
.day-panel{border-radius:22px;background:#fff9fd;min-height:480px;padding:24px 22px;position:sticky;top:16px}
.panel-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:22px}
.panel-head h2{font-size:22px;margin:0;font-weight:750;letter-spacing:-.4px}
.panel-arrows{display:flex;gap:6px}
.panel-arrows button{border:1px solid #e8e4ef;background:#fff;border-radius:12px;width:38px;height:38px;font-size:25px;color:#43516a;cursor:pointer}
.panel-events{display:flex;flex-direction:column;gap:11px}
.panel-event{display:flex;align-items:center;gap:9px;border-radius:14px;padding:14px 12px;background:#f3e7fc;min-height:60px}
.panel-event:nth-child(4n + 2){background:#ffe3ed}.panel-event:nth-child(4n + 3){background:#fff1d7}.panel-event:nth-child(4n){background:#e3edff}
.panel-event-text{font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1}
.panel-event button{border:0;background:transparent;color:#3b4561;font-size:17px;cursor:pointer;padding:5px}
.panel-event button:disabled{opacity:.25}
.panel-empty{font-size:15px;color:#9a91a4;padding:18px 2px}
.quick-form{display:flex;gap:9px;margin-top:23px}
.quick-form input{min-width:0;flex:1;border:1px solid #e8e3ef;background:#fff;border-radius:14px;padding:14px 13px;font-size:16px;color:#27304a}
.quick-form button{width:52px;border:0;border-radius:14px;background:#f76e9a;color:white;font-size:28px;cursor:pointer}
.toolbar{margin-bottom:13px}.toolbar strong{font-size:23px}
.nav{position:static;display:flex;background:transparent;border:0;padding:0;margin:0 0 15px;justify-content:center}
.nav button{width:auto;min-width:120px;font-size:16px;background:transparent}
.nav button.active{background:#f7d5e6;color:#222a42}
footer{margin-top:26px}
@media(max-width:800px){
 .app{padding:17px 12px 85px}
 .workspace{display:flex;flex-direction:column;gap:18px}
 #content,.day-panel{width:100%}
 .day-panel{position:static;min-height:0;padding:19px 15px}
 .cell{min-height:83px;padding:9px 3px 5px}
 .cell strong{font-size:17px}
 .cell .mark{font-size:11px;padding:4px 3px;margin-top:4px}
 .dow{font-size:12px;padding:10px 0}
 .panel-head h2{font-size:20px}
 .toolbar strong{font-size:19px}
 .day{min-height:145px;padding:12px}
}
@media(max-width:380px){.cell{min-height:75px}.cell strong{font-size:16px}.cell .mark{font-size:10px}.panel-event{padding:10px 7px}.panel-event button{padding:3px}}
.toolbar .nav{margin:0;gap:4px;flex-shrink:0}.toolbar .nav button{min-width:76px;padding:9px 12px}.toolbar strong{flex:0 1 auto;margin-right:auto}
@media(max-width:800px){.toolbar .nav{order:5;width:100%;justify-content:center}.toolbar .nav button{flex:1;max-width:180px}.toolbar strong{min-width:0}.toolbar{justify-content:space-between}}
.brand-icon{width:38px;height:38px;border-radius:9px;vertical-align:middle;margin-right:11px;box-shadow:0 3px 10px #f9a95b30}h1{display:flex;align-items:center}
/* Six weekly slots: five weekdays and one shared weekend slot */
.weekend-card{display:flex;flex-direction:column;gap:0;padding:0!important;overflow:hidden;cursor:default}
.weekend-day{appearance:none;border:0!important;background:transparent;display:block;text-align:left;width:100%;flex:1;min-height:95px;padding:12px 16px;cursor:pointer;color:inherit;font:inherit}
.weekend-day+.weekend-day{border-top:1px solid #eae4ed!important}
.weekend-day:hover,.weekend-day.selected-day{background:#f9f2fa}
.weekend-day .head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.weekend-day .num{font-size:25px;font-weight:750}
.weekend-day .weekday{font-size:12px;color:var(--muted)}
.weekend-day .plus{margin-left:auto}
.weekend-day .event{border:0;border-radius:7px;background:#f5deea;padding:7px 8px;margin:5px 0;font-size:15px;overflow-wrap:anywhere}
.weekend-day .empty{font-size:11px;color:#c4bfd0;margin-top:6px}
.month-blank{min-height:116px;pointer-events:none}
@media(max-width:800px){.month-blank{min-height:83px}.weekend-day{min-height:80px;padding:10px}.weekend-day .num{font-size:23px}}
@media(max-width:380px){.month-blank{min-height:75px}}
</style></head><body>
<main class="app"><h1><img src="./icon.svg" alt="" class="brand-icon">Market Events</h1><p class="sub">Your personal stock market event calendar</p>
<div class="toolbar"><div class="arrows"><button class="arrow" id="prev" aria-label="Previous">‹</button><button class="arrow" id="next" aria-label="Next">›</button></div><strong id="period"></strong><nav class="nav"><button id="weekTab" class="active">📆 Week</button><button id="monthTab">🗓️ Month</button></nav><button class="today" id="today">Today</button><button class="settings-btn" id="settings" aria-label="Calendar color settings" title="Colors">🎨</button></div>
<div class="workspace"><div id="content"></div><aside id="dayPanel" class="day-panel" aria-label="Selected day events"><div class="panel-head"><h2 id="panelDate"></h2><div class="panel-arrows"><button id="panelPrev" type="button" aria-label="Previous day">‹</button><button id="panelNext" type="button" aria-label="Next day">›</button></div></div><div id="panelEvents" class="panel-events"></div><form id="quickForm" class="quick-form"><input id="quickInput" type="text" maxlength="1000" placeholder="Add an event…" aria-label="New event text" required><button type="submit" aria-label="Add event">＋</button></form></aside></div><footer>Events only · Saved on this device 🌿</footer></main>

<div id="scrim" class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="Events editor">
<h2 id="editorTitle"></h2><div id="eventList" class="list"></div><button id="addEvent" class="add">＋ Add Event</button>
<form id="form" hidden>
<label class="field" for="name">Event<textarea id="name" required maxlength="1000" placeholder="Type your event here…" rows="3"></textarea></label>
<div class="actions"><button type="button" id="cancelEdit">Cancel</button><button type="button" id="delete" class="danger" hidden>Delete</button><button class="save" type="submit">Save Event</button></div></form>
<div class="actions"><button id="close" style="width:100%">Close</button></div></section></div>
<div id="colorScrim" class="scrim color-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-label="Calendar colors">
<h2>🎨 Calendar Colors</h2><p class="color-sub" id="colorPeriod"></p>
<div class="color-scope"><button type="button" id="scopeWeek">This Week</button><button type="button" id="scopeMonth">This Month</button></div>
<div class="palette" id="palette"></div>
<label class="custom-color">Custom color <input id="customColor" type="color" value="#f1e5fb"></label>
<div class="color-actions"><button type="button" id="resetColor">Reset Color</button><button type="button" id="closeColors">Done</button></div>
</section></div>
<script>
(()=>{'use strict';
const KEY='stock_market_event_calendar_v1';const $=s=>document.querySelector(s);
let events=[];try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');events=Array.isArray(parsed)?parsed:[]}catch{}
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,from=s=>new Date(s+'T12:00:00'),today=new Date(),todayKey=fmt(today);
let cursor=from(todayKey),mode='week',selected=todayKey,editing=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(events));
const COLOR_KEY='market_events_colors_v1';
let colors={week:{},month:{}};
try{const p=JSON.parse(localStorage.getItem(COLOR_KEY)||'{}');if(p&&typeof p==='object')colors={week:p.week&&typeof p.week==='object'?p.week:{},month:p.month&&typeof p.month==='object'?p.month:{}}}catch{}
const saveColors=()=>localStorage.setItem(COLOR_KEY,JSON.stringify(colors));
const paletteColors=['#f8d9e7','#e7d8fa','#cddcfb','#bce6f2','#c9ebd7','#f9e8b4','#ffd9b8','#f8c9c2','#f5d4f6','#d4d1fa','#c5e4d9','#ece0cb'];
let colorScope='week';
const weekKey=d=>fmt(monday(d)),monthKey=d=>fmt(new Date(d.getFullYear(),d.getMonth(),1)).slice(0,7);
const colorKey=()=>colorScope==='week'?weekKey(cursor):monthKey(cursor);
const chosenColor=()=>colors[colorScope][colorKey()]||'';
function applyColor(el,color){
 if(!color)return;
 el.style.backgroundColor=color;
 el.style.borderColor=color;
}
function refreshColors(){
 const week=colorScope==='week',key=colorKey();
 $('#scopeWeek').classList.toggle('active',week);
 $('#scopeMonth').classList.toggle('active',!week);
 $('#colorPeriod').textContent=week?'Week of '+monday(cursor).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const selected=chosenColor(),grid=$('#palette');grid.innerHTML='';
 paletteColors.forEach(c=>{
 const b=document.createElement('button');b.type='button';b.className='swatch'+(selected.toLowerCase()===c.toLowerCase()?' chosen':'');b.style.backgroundColor=c;b.title=c;b.setAttribute('aria-label','Select color '+c);
 b.onclick=()=>setColor(c);grid.append(b);
 });
 if(selected)$('#customColor').value=selected;
}
function setColor(c){colors[colorScope][colorKey()]=c;saveColors();refreshColors();render()}
function showColors(){colorScope=mode;refreshColors();$('#colorScrim').classList.add('show')}

const sorted=d=>events.filter(x=>x.date===d).sort((a,b)=>(Number.isFinite(a.order)?a.order:events.indexOf(a))-(Number.isFinite(b.order)?b.order:events.indexOf(b)));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function openDay(date){selected=date;editing=null;$('#form').hidden=true;$('#addEvent').hidden=false;render();if(mode==='week'&&window.innerWidth<801)$('#dayPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function panelRender(){
 const d=from(selected);
 $('#panelDate').textContent=d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
 const host=$('#panelEvents');host.innerHTML='';
 const records=sorted(selected);
 if(!records.length){const p=document.createElement('p');p.className='panel-empty';p.textContent='No events yet. Add one below!';host.append(p)}
 records.forEach((x,i)=>{
  const row=document.createElement('div');row.className='panel-event';
  const label=document.createElement('div');label.className='panel-event-text';label.textContent=x.name||'';
  const up=document.createElement('button');up.type='button';up.textContent='↑';up.title='Move up';up.disabled=i===0;up.onclick=()=>move(x.id,-1);
  const down=document.createElement('button');down.type='button';down.textContent='↓';down.title='Move down';down.disabled=i===records.length-1;down.onclick=()=>move(x.id,1);
  const editBtn=document.createElement('button');editBtn.type='button';editBtn.textContent='✎';editBtn.title='Edit';editBtn.onclick=()=>{edit(x.id);$('#scrim').classList.add('show');refreshEditor()};
  const del=document.createElement('button');del.type='button';del.textContent='×';del.title='Delete';del.onclick=()=>{if(!confirm('Delete this event?'))return;events=events.filter(e=>e.id!==x.id);save();render()};
  row.append(label,up,down,editBtn,del);host.append(row);
 });
}
function refreshEditor(){
 const d=from(selected);
 $('#editorTitle').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
 $('#eventList').innerHTML='';
 const records=sorted(selected);
 if(!records.length){const p=document.createElement('p');p.style.color='#aaa1b5';p.textContent='No events yet.';$('#eventList').append(p)}
 records.forEach((x,i)=>{
   const row=document.createElement('div');row.className='row';
   const txt=document.createElement('div');txt.className='event-text';txt.textContent=x.name||'';
   const controls=document.createElement('div');controls.className='row-controls';
   const up=document.createElement('button');up.type='button';up.textContent='↑';up.title='Move up';up.setAttribute('aria-label','Move event up');up.disabled=i===0;up.onclick=()=>move(x.id,-1);
   const down=document.createElement('button');down.type='button';down.textContent='↓';down.title='Move down';down.setAttribute('aria-label','Move event down');down.disabled=i===records.length-1;down.onclick=()=>move(x.id,1);
   const editBtn=document.createElement('button');editBtn.type='button';editBtn.textContent='Edit';editBtn.onclick=()=>edit(x.id);
   controls.append(up,down,editBtn);row.append(txt,controls);$('#eventList').append(row);
 });
}
function move(id,direction){
 const records=sorted(selected),i=records.findIndex(x=>x.id===id),j=i+direction;
 if(i<0||j<0||j>=records.length)return;
 [records[i],records[j]]=[records[j],records[i]];
 records.forEach((x,k)=>x.order=k);
 save();refreshEditor();render();
}
function edit(id){
 editing=id;
 const x=events.find(e=>e.id===id);
 $('#name').value=x?.name||'';
 $('#delete').hidden=!x;
 $('#form').hidden=false;
 $('#addEvent').hidden=true;
 $('#name').focus();
}
function render(){
 const root=$('#content');root.innerHTML='';
 $('#weekTab').classList.toggle('active',mode==='week');
 $('#monthTab').classList.toggle('active',mode==='month');
 function appendEvents(host,key,limit){
  const records=sorted(key);
  if(!records.length){let e=document.createElement('div');e.className='empty';e.textContent='Tap to add event';host.append(e)}
  records.slice(0,limit??records.length).forEach(x=>{
   let el=document.createElement('div');el.className='event';
   if(x.time){let t=document.createElement('time');t.textContent=x.time;el.append(t)}
   let name=document.createElement('span');name.textContent=x.name;el.append(name);host.append(el)
  });
 }
 if(mode==='week'){
  const start=monday(cursor),end=addDays(start,6);
  $('#period').textContent=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let wrap=document.createElement('div');wrap.className='days';
  for(let i=0;i<5;i++){
   let d=addDays(start,i),key=fmt(d),card=document.createElement('div');
   card.className='day'+(key===todayKey?' today-card':'')+(key===selected?' selected-day':'');
   let head=document.createElement('div');head.className='head';
   head.innerHTML=`<span class="num">${d.getDate()}</span><span class="weekday">${d.toLocaleDateString('en-US',{weekday:'short'})}</span><span class="plus">+</span>`;
   card.append(head);appendEvents(card,key);card.onclick=()=>openDay(key);wrap.append(card);
  }
  let weekend=document.createElement('div');weekend.className='day weekend-card';
  for(let i=5;i<7;i++){
   let d=addDays(start,i),key=fmt(d),section=document.createElement('button');
   section.type='button';section.className='weekend-day'+(key===selected?' selected-day':'')+(key===todayKey?' today-card':'');
   let head=document.createElement('div');head.className='head';
   head.innerHTML=`<span class="num">${d.getDate()}</span><span class="weekday">${d.toLocaleDateString('en-US',{weekday:'short'})}</span><span class="plus">+</span>`;
   section.append(head);appendEvents(section,key);section.onclick=()=>openDay(key);weekend.append(section);
  }
  wrap.append(weekend);
  if(colors.week[weekKey(cursor)]){wrap.style.backgroundColor=colors.week[weekKey(cursor)];wrap.style.borderRadius='18px';wrap.style.padding='10px'}
  root.append(wrap);
 }else{
  let y=cursor.getFullYear(),m=cursor.getMonth();
  $('#period').textContent=cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let grid=document.createElement('div');grid.className='month-grid';
  ['M','T','W','T','F','S','S'].forEach(a=>{let el=document.createElement('div');el.className='dow';el.textContent=a;grid.append(el)});
  const firstWeekday=(new Date(y,m,1).getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  for(let i=0;i<firstWeekday;i++){let blank=document.createElement('div');blank.className='month-blank';blank.setAttribute('aria-hidden','true');grid.append(blank)}
  for(let day=1;day<=daysInMonth;day++){
   let d=new Date(y,m,day),key=fmt(d),records=sorted(key),cell=document.createElement('button');
   cell.type='button';
   cell.className='cell'+(key===todayKey?' today-cell':'')+(key===selected?' selected-cell':'');
   let num=document.createElement('strong');num.textContent=day;cell.append(num);
   records.slice(0,2).forEach(x=>{let item=document.createElement('div');item.className='mark';item.textContent=(x.time?x.time+' ':'')+x.name;cell.append(item)});
   if(records.length>2){let more=document.createElement('div');more.className='more';more.textContent=`+${records.length-2} more`;cell.append(more)}
   cell.onclick=()=>openDay(key);grid.append(cell);
  }
  if(colors.month[monthKey(cursor)]){grid.style.backgroundColor=colors.month[monthKey(cursor)];grid.style.borderRadius='18px';grid.style.padding='10px'}
  root.append(grid);
 }
 panelRender();
}
$('#panelPrev').onclick=()=>{selected=fmt(addDays(from(selected),-1));cursor=from(selected);render()};
$('#panelNext').onclick=()=>{selected=fmt(addDays(from(selected),1));cursor=from(selected);render()};
$('#quickForm').onsubmit=e=>{e.preventDefault();const name=$('#quickInput').value.trim();if(!name)return;events.push({id:'evt_'+Date.now()+'_'+Math.random().toString(36).slice(2),date:selected,name,order:sorted(selected).length});save();$('#quickInput').value='';render()};
$('#prev').onclick=()=>{cursor=mode==='week'?addDays(cursor,-7):new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};
$('#next').onclick=()=>{cursor=mode==='week'?addDays(cursor,7):new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};
$('#today').onclick=()=>{cursor=from(todayKey);render()};
$('#weekTab').onclick=()=>{mode='week';render()};$('#monthTab').onclick=()=>{mode='month';render()};
$('#settings').onclick=showColors;
$('#scopeWeek').onclick=()=>{colorScope='week';refreshColors()};
$('#scopeMonth').onclick=()=>{colorScope='month';refreshColors()};
$('#customColor').oninput=e=>setColor(e.target.value);
$('#resetColor').onclick=()=>{delete colors[colorScope][colorKey()];saveColors();refreshColors();render()};
$('#closeColors').onclick=()=>$('#colorScrim').classList.remove('show');
$('#colorScrim').onclick=e=>{if(e.target===$('#colorScrim'))$('#colorScrim').classList.remove('show')};
$('#addEvent').onclick=()=>edit(null);$('#cancelEdit').onclick=()=>{$('#form').hidden=true;$('#addEvent').hidden=false;editing=null};
$('#form').onsubmit=e=>{
 e.preventDefault();
 const name=$('#name').value.trim();if(!name)return;
 if(editing){const x=events.find(e=>e.id===editing);if(x)x.name=name}
 else{const records=sorted(selected);events.push({id:'evt_'+Date.now()+'_'+Math.random().toString(36).slice(2),date:selected,name,order:records.length})}
 save();$('#form').hidden=true;$('#addEvent').hidden=false;editing=null;refreshEditor();render();
};
$('#delete').onclick=()=>{
 if(!editing||!confirm('Delete this event?'))return;
 events=events.filter(x=>x.id!==editing);save();editing=null;
 $('#form').hidden=true;$('#addEvent').hidden=false;refreshEditor();render();
};
function close(){ $('#scrim').classList.remove('show');$('#form').hidden=true;$('#addEvent').hidden=false;editing=null}
$('#close').onclick=close;$('#scrim').onclick=e=>{if(e.target===$('#scrim'))close()};
render();
})();
</script></body></html>
